name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: |
          npm ci
          python -m pip install "Django>=5.2,<5.3" "djangorestframework>=3.15,<3.17"

      - name: Type-check
        run: npx tsc -p . --noEmit

      - name: Unit tests
        run: npm test
        env:
          FETCHLENS_TEST_PYTHON: python

      - name: Python helper tests
        run: npm run test:py

      - name: Bundle and package
        run: |
          npm run package
          ls -la *.vsix

      - name: End-to-end tests in VS Code
        run: xvfb-run -a npm run test:e2e
        env:
          FETCHLENS_TEST_PYTHON: python
